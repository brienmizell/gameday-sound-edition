<!DOCTYPE html>
<html lang="en">
<!--
  The 2018 page, running again.

  Only three lines differ from index.html next to it:
    · the two asset paths lost their scripts/ and styles/ prefixes (the files
      moved into legacy/ during the 2026 rebuild),
    · the axios CDN <script> is gone — demo.js stubs it,
    · demo.js loads before index.js.
  index.js and index.css are the originals, unmodified.
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <title>Gameday Ready!</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Cabin+Sketch" rel="stylesheet">
    <script src="demo.js"></script>
</head>

<body>
    <h1 id="mainHeader">Are you Game-day Ready?</h1>

    <input type="text" id="myInput" onkeyup="myFunction()"
    placeholder="Search for your favorite team...">

     <div id="gamescore">Game Scores:</div>
<section class="flex-container gameData" data-home-team games_this_week>
</section>
    <div class="container">
    <h2 id="text-center">Enter Location</h2>
        <form id="location-form">
        <input type="text" id="location-input" class="form-control form-control-lg">
        <br>
        <button type="submit" class="btn btn-primary btn-block">Submit</button>
    </form>
    <div class="card-block" id="formatted-address"></div>
    <div class="card-block" id="address-componets"></div>
    <div class="card-block" id="geometry"></div>
    </div>
    <script src="index.js"></script>
</body>
<footer id="sticky">Evan and Brien - 2018</footer>
<button onclick="topFunction()" id="myBtn" title="Click to go to the top of the page..">Go To Top</button>

</html>
